name: CIFuzz

on:
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - .github/workflows/cifuzz.yml

permissions:
  contents: read

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: source
      - uses: actions/checkout@v7
        with:
          repository: google/oss-fuzz
          ref: ac54c4f21555fabcf24e19bad3213ac194ee9f85
          path: oss-fuzz
      # The GitHub wrapper fetches PR numbers from OpenSC/OpenSC even in forks.
      # Generic mode instead builds the checked-out source mounted into Docker.
      - name: Build and run fuzzers against the pull-request head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_SRC_PATH: ${{ github.workspace }}/source
          WORKSPACE: ${{ runner.temp }}/cifuzz
          REPOSITORY: OpenSC
          OSS_FUZZ_PROJECT_NAME: opensc
          DRY_RUN: '0'
          SANITIZER: address
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$WORKSPACE"
          python3 oss-fuzz/infra/cifuzz/run_cifuzz.py
      - name: Upload fuzzing artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: artifacts
          path: ${{ runner.temp }}/cifuzz/out/artifacts
