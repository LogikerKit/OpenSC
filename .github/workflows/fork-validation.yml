name: Fork source validation

on:
  workflow_dispatch:
    inputs:
      check:
        description: Validation to run for the three submitted branches
        type: choice
        default: all
        options:
          - all
          - codeql
          - cifuzz
          - mingw
          - oseid
      pr:
        description: Submitted pull request to validate
        type: choice
        default: all
        options:
          - all
          - '3895'
          - '3896'
          - '3897'

permissions:
  contents: read

jobs:
  select:
    name: Select submitted revisions
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.select.outputs.sources }}
    steps:
      - id: select
        env:
          SELECTED_PR: ${{ inputs.pr }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          sources = [
              {"pr": 3895, "branch": "fix-pkcs15-complete-tlv-records", "sha": "0850642e47a80bf6a0755b3bdc7cca732a924aa7"},
              {"pr": 3896, "branch": "fix-pkcs11-zero-pss-hash", "sha": "a7eef053341002eaecf7172116ff37f3bec00b0b"},
              {"pr": 3897, "branch": "rfc-epki-2130-profile", "sha": "88d8a727c9242de4af1ce3066839a1bff53817b8"},
          ]
          selected = os.environ["SELECTED_PR"]
          if selected != "all":
              sources = [source for source in sources if str(source["pr"]) == selected]
          if not sources:
              raise SystemExit("Unknown submitted pull request")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("sources=" + json.dumps(sources) + "\n")
          PYTHON
  codeql:
    needs: select
    if: inputs.check == 'all' || inputs.check == 'codeql'
    name: CodeQL PR ${{ matrix.source.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.select.outputs.sources) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0
      - name: Verify source revision
        env:
          EXPECTED_SHA: ${{ matrix.source.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: cpp
          config-file: ./.github/.codeql.yml
      - run: .github/setup-linux.sh force-install
      - run: .github/build.sh
      - name: Upload failed test logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: codeql-${{ matrix.source.pr }}-test-logs
          path: |
            tests/*.log
            src/tests/unittests/*.log
      - uses: github/codeql-action/analyze@v4.38.2
        with:
          ref: refs/heads/${{ matrix.source.branch }}
          sha: ${{ matrix.source.sha }}
          category: /language:cpp

  cifuzz:
    needs: select
    if: inputs.check == 'all' || inputs.check == 'cifuzz'
    name: CIFuzz PR ${{ matrix.source.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.select.outputs.sources) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0
          path: opensc
      - uses: actions/checkout@v7
        with:
          repository: google/oss-fuzz
          ref: ac54c4f21555fabcf24e19bad3213ac194ee9f85
          path: oss-fuzz
      - name: Build and run fuzzers against the exact checkout
        env:
          EXPECTED_SHA: ${{ matrix.source.sha }}
          PROJECT_SRC_PATH: ${{ github.workspace }}/opensc
          WORKSPACE: ${{ runner.temp }}/cifuzz
          REPOSITORY: OpenSC
          OSS_FUZZ_PROJECT_NAME: opensc
          DRY_RUN: '0'
          SANITIZER: address
        run: |
          test "$(git -C opensc rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$WORKSPACE"
          python3 oss-fuzz/infra/cifuzz/run_cifuzz.py
      - name: Upload fuzzing artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cifuzz-${{ matrix.source.pr }}-artifacts
          path: ${{ runner.temp }}/cifuzz/out/artifacts

  mingw:
    needs: select
    if: inputs.check == 'all' || inputs.check == 'mingw'
    name: MinGW PR ${{ matrix.source.pr }} (${{ matrix.target }})
    # Ubuntu26 pairs GCC13 with MinGW-w64 v13 headers whose printf aliases
    # trigger incorrect builtin format diagnostics. Keep the stable toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [mingw, mingw32]
        source: ${{ fromJSON(needs.select.outputs.sources) }}
        include:
          - target: mingw
            source:
              pr: baseline
              sha: ccfa7600f7c7ae249118d5f301e679e476a004a5
          - target: mingw32
            source:
              pr: baseline
              sha: ccfa7600f7c7ae249118d5f301e679e476a004a5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: fork-ci
          sparse-checkout: .github/setup-linux.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify source and apply runner setup fix
        env:
          EXPECTED_SHA: ${{ matrix.source.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cp fork-ci/.github/setup-linux.sh .github/setup-linux.sh
          git diff -- .github/setup-linux.sh
          test "$(git diff --name-only)" = '.github/setup-linux.sh'
      - run: .github/setup-linux.sh ${{ matrix.target }} force-install
      - run: .github/build.sh ${{ matrix.target }}
      - name: Upload failed build logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mingw-${{ matrix.source.pr }}-${{ matrix.target }}-logs
          path: |
            config.log
            tests/*.log
            src/tests/unittests/*.log

  oseid:
    needs: select
    if: inputs.check == 'all' || inputs.check == 'oseid'
    name: OsEID LibreSSL ${{ matrix.source.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIBRESSL_VERSION: 4.2.1
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.select.outputs.sources) }}
        include:
          - source:
              pr: baseline
              sha: ccfa7600f7c7ae249118d5f301e679e476a004a5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: fork-ci
          sparse-checkout: .github/test-oseid.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify source and apply simulator setup fix
        env:
          EXPECTED_SHA: ${{ matrix.source.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cp fork-ci/.github/test-oseid.sh .github/test-oseid.sh
          git diff -- .github/test-oseid.sh
          test "$(git diff --name-only)" = '.github/test-oseid.sh'
      - uses: actions/cache/restore@v6
        with:
          path: libressl-${{ env.LIBRESSL_VERSION }}/
          key: libressl-${{ env.LIBRESSL_VERSION }}
      - name: Install matching optional-feature dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglib2.0-dev libnss3-dev gnutls-bin libusb-dev libudev-dev flex libnss3-tools
      - run: .github/setup-linux.sh oseid libressl
      - run: .github/build.sh dist libressl valgrind
      - run: .github/test-oseid.sh
      - run: .github/test-oseid.sh valgrind
      - name: Upload failed test logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: oseid-${{ matrix.source.pr }}-logs
          path: |
            config.log
            tests/*.log
            src/tests/unittests/*.log
            src/tests/p11test/oseid.json
